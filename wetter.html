<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundplantage - Regen-Radar</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --radar-blue: #0A4D8C;
      --sun-yellow: #FFD966;
      --bg-light: #F7F9FC;
      --card-bg: #FFFFFF;
      --text-dark: #1E2A3A;
      --text-muted: #5A6B7C;
      --border-radius: 12px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      --temp-warm: #2E7D32;
      --temp-cold: #1565C0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.5;
    }

    header {
      background: var(--radar-blue);
      color: #fff;
      padding: 0.7rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    header h1 { font-size: 1.4rem; font-weight: 600; }
    header .current-location {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .location-bar {
      max-width: 1900px;
      margin: 0.6rem auto 0;
      padding: 0 1rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 250px;
      max-width: 420px;
    }

    #location-search {
      width: 100%;
      padding: 0.55rem 2.6rem 0.55rem 0.9rem;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fff;
      font-family: inherit;
    }

    #location-search:focus {
      outline: none;
      border-color: var(--radar-blue);
      box-shadow: 0 0 0 3px rgba(10, 77, 140, 0.15);
    }

    .search-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      color: var(--radar-blue);
    }

    .search-btn:hover { background: #F0F4FA; }

    .search-results {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      margin-top: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      z-index: 2000;
      max-height: 320px;
      overflow-y: auto;
    }

    .search-result-item {
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      font-size: 0.85rem;
      border-bottom: 1px solid #f0f0f0;
      color: var(--text-dark);
    }

    .search-result-item:hover { background: #F0F4FA; }
    .search-result-item:last-child { border-bottom: none; }

    .favorites {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .fav-btn {
      background: #fff;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      padding: 0.42rem 0.75rem;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
      color: var(--text-dark);
    }

    .fav-btn:hover {
      background: #F0F4FA;
      border-color: var(--radar-blue);
    }

    .fav-btn.empty {
      font-weight: 700;
      color: var(--radar-blue);
      min-width: 38px;
      justify-content: center;
      font-size: 1rem;
    }

    .fav-temp {
      font-weight: 700;
      color: var(--radar-blue);
    }

    .fav-remove {
      color: #aaa;
      font-size: 1.05rem;
      line-height: 1;
      padding: 0 0.15rem;
      border-radius: 3px;
    }

    .fav-remove:hover { color: #d32f2f; background: #ffeaea; }

    .container {
      max-width: 1900px;
      margin: 0.0rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: stretch;
    }

    @media (max-width: 1200px) {
      .container { grid-template-columns: 1fr; align-items: start; }
      #radar-map { min-height: max(320px, 40vh); }
    }

    .radar-card {
      display: flex;
      flex-direction: column;
      min-height: 380px;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 0.0rem;
      min-width: 0;
    }

    .right-col > .card { display: flex; flex-direction: column; }
    /* Skeleton-Mindesthöhen – verhindern Layoutsprung beim ersten Laden */
    .right-col > .card:first-child { min-height: 210px; }
    .right-col > .card:last-child  { flex: 1; min-height: 380px; }
    .right-col > .card:last-child .daily-forecast-grid { flex: 1; }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 0.9rem 1.2rem;
      min-width: 0;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--radar-blue);
      border-bottom: 2px solid var(--sun-yellow);
      padding-bottom: 0.4rem;
      display: inline-block;
      align-self: flex-start;
    }

    #radar-map {
      flex: 1;
      min-height: 280px;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 0.4rem;
      background: #DDE6F0;
      position: relative;
    }

    .leaflet-tile-pane .leaflet-layer:first-child .leaflet-tile {
      filter: hue-rotate(30deg) saturate(1.7) brightness(0.92);
    }

    .radar-tiles .leaflet-tile { transition: none !important; }

    .city-label {
      background: transparent;
      border: none;
      box-shadow: none;
      font-weight: 600;
      font-size: 0.78rem;
      color: #1E2A3A;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff;
      padding: 0;
      white-space: normal;
      text-align: left;
      line-height: 1.25;
    }

    .city-label .city-temp {
      display: block;
      font-weight: 700;
      font-size: 0.85rem;
      color: #0A4D8C;
    }

    .landmark-icon { background: transparent; border: none; }

    .current-location-label {
      background: transparent;
      border: none;
      box-shadow: none;
      font-weight: 700;
      font-size: 0.9rem;
      color: #0A4D8C;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
      padding: 0;
      white-space: nowrap;
    }

    .radar-time-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1100;
      background: rgba(10, 77, 140, 0.95);
      color: #FFFFFF;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      border: 2px solid var(--sun-yellow);
      pointer-events: none;
      white-space: nowrap;
    }

    .radar-timeline {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.5rem;
      padding: 0.4rem 0;
    }

    .tl-play-btn {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--radar-blue);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .tl-play-btn:hover { background: #083a6b; }

    .tl-track-wrapper { flex: 1; position: relative; }

    .tl-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: transparent;
      outline: none;
      cursor: pointer;
      --slider-track-bg: #90a4ae;
    }

    .tl-slider::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px; background: var(--slider-track-bg);
    }
    .tl-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--radar-blue); border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      cursor: pointer; margin-top: -6px;
    }
    .tl-slider::-moz-range-track {
      height: 6px; border-radius: 3px; background: var(--slider-track-bg);
    }
    .tl-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--radar-blue); border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); cursor: pointer;
    }

    .tl-ticks { position: relative; height: 14px; margin-top: 2px; }
    .tl-tick {
      position: absolute; top: 0; width: 1px; height: 8px;
      background: #aab4c0; transform: translateX(-50%);
    }
    .tl-tick.nowcast {
      background: var(--sun-yellow); height: 10px; width: 2px;
    }
    .tl-labels {
      display: flex; justify-content: space-between;
      font-size: 0.7rem; color: var(--text-muted); margin-top: 2px;
    }

    .forecast-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 6px;
      margin-top: 0.4rem;
      table-layout: fixed;
    }

    .forecast-table td {
      background: #d8d8d8;
      border-radius: 8px;
      padding: 0.5rem 0.25rem;
      text-align: center;
      vertical-align: middle;
      transition: background 0.2s;
    }

    .forecast-table td:hover { background: #cdcdcd; }

    .forecast-table .fc-time {
      display: block; font-weight: 600; font-size: 0.9rem;
      color: var(--text-dark); margin-bottom: 0.15rem;
    }
    .forecast-table .fc-icon {
      font-size: 1.5rem; display: block; line-height: 1.2; margin: 0.05rem 0;
    }
    .forecast-table .fc-temp {
      display: block; font-size: 1rem; font-weight: 700;
    }
    .forecast-table .fc-temp.pos { color: var(--temp-warm); }
    .forecast-table .fc-temp.neg { color: var(--temp-cold); }

    .forecast-table .fc-rain {
      display: flex; align-items: center; justify-content: center;
      gap: 4px; font-size: 0.75rem; font-weight: 600;
      color: var(--text-dark); margin-top: 0.15rem;
    }

    .rain-dot {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; border: 1px solid rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .daily-forecast-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      margin-top: 0.4rem;
      background: #d8d8d8;
      border: 1px solid rgb(211, 210, 210);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      min-height: 0;
    }

    .daily-col {
      padding: 0.7rem 0.25rem;
      text-align: center;
      border-right: 1px solid #b8b8b8;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .daily-col:last-child { border-right: none; }

    .row-datum { font-size: 0.72rem; color: #555; }
    .row-wochentag {
      font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem;
    }
    .row-wochentag .rel {
      font-size: 0.68rem; font-weight: normal; color: #555;
    }
    .row-max { font-size: 0.95rem; font-weight: 700; color: var(--temp-warm); }
    .row-separator {
      border: none; border-top: 1px solid #a8a8a8;
      width: 50%; margin: 0.25rem auto;
    }
    .row-min {
      font-size: 0.9rem; font-weight: 600; color: var(--temp-cold);
      margin-bottom: 0.5rem;
    }

    .time-block { margin-bottom: 0.35rem; }
    .icon-wind {
      display: flex; align-items: center; justify-content: center;
      gap: 4px; margin-bottom: 0.1rem;
    }
    .slot-icon { font-size: 1.5rem; }
    .slot-label {
      font-size: 0.62rem; color: #555;
      text-transform: uppercase; letter-spacing: 0.3px;
    }

    .wind-container {
      display: flex; align-items: center; gap: 2px;
      font-size: 0.68rem; color: #4a4a4a;
    }
    .wind-container svg { width: 13px; height: 13px; }

    .row-sun, .row-rain {
      font-size: 0.72rem; color: #444;
      display: flex; align-items: center; justify-content: center;
      gap: 3px; margin-top: 0.15rem;
    }
    .row-sun { margin-top: auto; padding-top: 0.3rem; }

    @media (max-width: 1200px) {
      .daily-forecast-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .slot-icon { font-size: 1.6rem; }
      .slot-label { font-size: 0.7rem; }
    }

    @media (max-width: 700px) {
      .daily-forecast-grid { grid-template-columns: repeat(2, 1fr); }
      .daily-col:nth-child(2n) { border-right: none; }
      .daily-col:nth-child(-n+2) { border-bottom: 1px solid #b8b8b8; }
    }
    @media (max-width: 400px) {
      .daily-forecast-grid { grid-template-columns: 1fr; }
      .daily-col { border-right: none; border-bottom: 1px solid #b8b8b8; }
      .daily-col:last-child { border-bottom: none; }
    }

    footer {
      text-align: center;
      padding: 1.2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a { color: var(--radar-blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>

  <header>
    <h1>Soundplantage - Regen-Radar</h1>
    <div class="current-location">📍 <span id="current-location-name">Neuenkirchen‑Tewel</span></div>
  </header>

  <div class="location-bar">
    <div class="search-wrapper">
      <input type="text" id="location-search" placeholder="Ort suchen (z. B. Hamburg, Walsrode, Paris)…" autocomplete="off">
      <button class="search-btn" id="search-btn" title="Suchen">🔍</button>
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="favorites" id="favorites-list"></div>

  <div class="container">
    <div class="card radar-card">
      <h2>🌧️ Regen‑Radar</h2>

          <div class="tl-labels">
            <span id="tl-start-label">–</span>
            <span id="tl-end-label">–</span>
          </div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <h2>🌡️ Nächste 24 Stunden – <span id="forecast-location">Tewel</span></h2>
        <table class="forecast-table" id="forecast-table">
          <tbody>
            <tr><td colspan="4">Lade Vorhersage…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card">
        <h2>📅 4-Tage-Vorhersage</h2>
        <div class="daily-forecast-grid" id="daily-forecast-grid">
          <div>Lade 4-Tage-Vorhersage…</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Radar‑Daten: <a href="https://librewxr.net" target="_blank">LibreWXR</a> •
    Vorhersage‑Daten: <a href="https://open-meteo.com/" target="_blank">Open‑Meteo</a> •
    Karten‑Daten: <a href="https://www.esri.com/" target="_blank">Esri</a> •
    Ortssuche: <a href="https://nominatim.openstreetmap.org/" target="_blank">OpenStreetMap Nominatim</a>
  </footer>

    function debounce(fn, delay) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    function loadStoredState() {

        if (f) favorites = JSON.parse(f);

    function isSameAsCurrent(city) {
      const a = (city.name || '').trim().toLowerCase();
      const b = (currentLocation.name || '').trim().toLowerCase();
      if (a && b && a === b) return true;
      return Math.abs(city.lat - currentLocation.lat) < 0.02 &&
             Math.abs(city.lon - currentLocation.lon) < 0.02;
    }

    document.addEventListener('DOMContentLoaded', initApp);

    function initApp() {
      const container = document.getElementById('radar-map');

      setTimeout(() => map.invalidateSize(), 200);

      // Leaflet an Containergröße anpassen – bei Skeleton, Datenload und Animation
      let radarResizeTimer = null;
      function scheduleRadarInvalidate() {
        if (radarResizeTimer) return;
        radarResizeTimer = setTimeout(() => {
          radarResizeTimer = null;
          if (map && map._container) map.invalidateSize({ pan: false });
        }, 100);
      }
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(scheduleRadarInvalidate);
        ro.observe(container);
      }

      const timeOverlay = document.createElement('div');

      timeOverlay.id = 'radar-time-overlay';
      timeOverlay.textContent = 'Radar · –';
      container.appendChild(timeOverlay);

      const redPinSvg = `

      const redIcon = L.icon({
        iconUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(redPinSvg),

      const currentMarker = L.marker(

        className: 'current-location-label'

      const cityGroup = L.layerGroup().addTo(map);
      const landmarkGroup = L.layerGroup().addTo(map);
      const landmarkMarkers = [];

      const triangleSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
          <polygon points="10,2 19,18 1,18" fill="#8D6E63" stroke="#4E342E"
                   stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      `;
      const mountainIcon = L.divIcon({
        html: triangleSvg,
        className: 'landmark-icon',
        iconSize: [20, 20],
        iconAnchor: [10, 18]
      });

      const waveSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
          <path d="M2 15 Q6 10 10 15 T18 15 T22 15" fill="none" stroke="#1565C0"
                stroke-width="2.5" stroke-linecap="round"/>
          <path d="M2 20 Q6 15 10 20 T18 20 T22 20" fill="none" stroke="#42A5F5"
                stroke-width="2" stroke-linecap="round" opacity="0.7"/>

      `;
      const waterIcon = L.divIcon({
        html: waveSvg,
        className: 'landmark-icon',
        iconSize: [22, 22],
        iconAnchor: [11, 16]
      });

      function renderLandmarkMarkers() {
        LANDMARKS.forEach(lm => {
          const icon = lm.type === 'water' ? waterIcon : mountainIcon;
          const marker = L.marker([lm.lat, lm.lon], { icon });
          const prefix = lm.type === 'water' ? '🌊 ' : '';
          marker.bindTooltip(`${prefix}${lm.name}`, {
            permanent: true,
            direction: 'right',
            offset: [10, -6],
            className: 'city-label'
          });
          marker.addTo(landmarkGroup);
          landmarkMarkers.push({ lm, marker });
        });
      }

      async function updateMountainTemps() {
        const mountains = landmarkMarkers.filter(m => m.lm.type === 'mountain');
        if (mountains.length === 0) return;
        try {
          const url = new URL('https://api.open-meteo.com/v1/forecast');
          url.searchParams.set('latitude', mountains.map(m => m.lm.lat).join(','));
          url.searchParams.set('longitude', mountains.map(m => m.lm.lon).join(','));
          url.searchParams.set('elevation', mountains.map(m => m.lm.elevation).join(','));
          url.searchParams.set('current', 'temperature_2m');
          url.searchParams.set('timezone', 'Europe/Berlin');
          const resp = await fetch(url);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          const results = Array.isArray(data) ? data : [data];
          mountains.forEach((m, idx) => {
            const t = results[idx]?.current?.temperature_2m;
            if (t !== null && t !== undefined) {
              m.marker.setTooltipContent(
                `<span class="city-name">${m.lm.name}</span>` +
                `<span class="city-temp">${Math.round(t)}°C</span>`
              );
            }
          });
        } catch (err) { console.warn('[Berge]', err); }
      }

      async function updateWaterTemps() {
        const waters = landmarkMarkers.filter(m => m.lm.type === 'water');
        if (waters.length === 0) return;
        try {
          const url = new URL('https://marine-api.open-meteo.com/v1/marine');
          url.searchParams.set('latitude', waters.map(m => m.lm.lat).join(','));
          url.searchParams.set('longitude', waters.map(m => m.lm.lon).join(','));
          url.searchParams.set('current', 'sea_surface_temperature');
          url.searchParams.set('timezone', 'Europe/Berlin');
          const resp = await fetch(url);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          const results = Array.isArray(data) ? data : [data];
          waters.forEach((m, idx) => {
            const t = results[idx]?.current?.sea_surface_temperature;
            if (t !== null && t !== undefined) {
              m.marker.setTooltipContent(
                `<span class="city-name">🌊 ${m.lm.name}</span>` +
                `<span class="city-temp">${Math.round(t)}°C</span>`
              );
            }
          });
        } catch (err) { console.warn('[Wasser]', err); }
      }

      // Lineare Interpolation zwischen zwei Stundenwerten.
      function interpolateHourly(hourly, targetUnix) {
        if (!hourly || hourly.length === 0) return null;
        if (targetUnix <= hourly[0].time) return Math.round(hourly[0].temp);
        const last = hourly[hourly.length - 1];
        if (targetUnix >= last.time) return Math.round(last.temp);
        for (let i = 0; i < hourly.length - 1; i++) {
          if (targetUnix >= hourly[i].time && targetUnix <= hourly[i + 1].time) {
            const frac = (targetUnix - hourly[i].time) / (hourly[i + 1].time - hourly[i].time);
            return Math.round(hourly[i].temp + frac * (hourly[i + 1].temp - hourly[i].temp));
          }
        }
        return null;
      }

      // Setzt die Tooltips der sichtbaren Städte auf den Frame-Zeitpunkt.
      function updateCityTempsForFrame(useCurrent) {
        if (currentCityMarkers.length === 0) return;
        const frameUnix = lastFrameTime !== null ? lastFrameTime : Date.now() / 1000;

        currentCityMarkers.forEach(entry => {
          const { city, circle } = entry;
          const data = cityTempCache[city.name];
          if (!data) return;

          let temp;
          if (useCurrent) {
            if (data.now === null || data.now === undefined) return;
            temp = Math.round(data.now);
          } else {
            temp = interpolateHourly(data.hourly, frameUnix);
          }
          if (temp === null || temp === undefined) return;

          if (entry.lastTemp === temp) return;
          entry.lastTemp = temp;

          circle.setTooltipContent(
            `<span class="city-name">${city.name}</span>` +
            `<span class="city-temp">${temp}°C</span>`
          );
        });
      }

      let cityUpdateToken = 0;

      async function updateCitiesInView() {
        const token = ++cityUpdateToken;
        const bounds = map.getBounds();
        const top10 = LOCAL_CITIES
          .filter(city => bounds.contains([city.lat, city.lon]) && !isSameAsCurrent(city))
          .sort((a, b) => b.pop - a.pop)
          .slice(0, 10);

        cityGroup.clearLayers();

        const markers = top10.map(city => {
          const radius = Math.min(7, 3 + Math.log10(city.pop / 1000) * 1.5);
          const circle = L.circleMarker([city.lat, city.lon], {
            radius, color: '#0A4D8C', fillColor: '#0A4D8C',
            fillOpacity: 0.9, weight: 1.5
          });
          circle.bindTooltip(city.name, {
            permanent: true, direction: 'right',
            offset: [radius + 3, 0], className: 'city-label'
          });
          circle.addTo(cityGroup);
          return { city, circle, lastTemp: undefined };
        });

        currentCityMarkers = markers;

        if (markers.length === 0) return;

        try {
          const url = new URL('https://api.open-meteo.com/v1/forecast');
          url.searchParams.set('latitude', markers.map(m => m.city.lat).join(','));
          url.searchParams.set('longitude', markers.map(m => m.city.lon).join(','));
          url.searchParams.set('current', 'temperature_2m');
          url.searchParams.set('hourly', 'temperature_2m');
          url.searchParams.set('past_hours', '4');
          url.searchParams.set('forecast_hours', '3');
          url.searchParams.set('timezone', 'Europe/Berlin');
          url.searchParams.set('timeformat', 'unixtime');

          const resp = await fetch(url);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          const results = Array.isArray(data) ? data : [data];
          if (token !== cityUpdateToken) return;

          const validNames = new Set(markers.map(m => m.city.name));
          Object.keys(cityTempCache).forEach(k => {
            if (!validNames.has(k)) delete cityTempCache[k];
          });

          markers.forEach((m, idx) => {
            const entry = results[idx];
            if (!entry) return;
            const now = entry.current?.temperature_2m;
            const hTime = entry.hourly?.time;
            const hTemp = entry.hourly?.temperature_2m;
            if (now === null || now === undefined) return;
            if (!Array.isArray(hTime) || !Array.isArray(hTemp) || hTime.length !== hTemp.length) return;

            const hourly = hTime.map((t, i) => ({ time: t, temp: hTemp[i] }));
            cityTempCache[m.city.name] = { now, hourly };
          });

          const useCurrent = currentFrameIndex === -1 || currentFrameIndex === pastFrameCount - 1;
          updateCityTempsForFrame(useCurrent);

        } catch (err) { console.warn('[Städte]', err); }
      }

      map.on('moveend', debounce(updateCitiesInView, 150));
      updateCitiesInView();

      const slider = document.getElementById('tl-slider');
      const ticksContainer = document.getElementById('tl-ticks');
      const playBtn = document.getElementById('play-pause-btn');
      const startLabel = document.getElementById('tl-start-label');
      const endLabel = document.getElementById('tl-end-label');

      function formatFrameTime(unixSeconds) {
        return new Date(unixSeconds * 1000)
          .toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      }

      function clearRadarLayers() {
        radarLayers.forEach(layer => { if (map.hasLayer(layer)) map.removeLayer(layer); });
        radarLayers = [];
      }

      async function loadRadar() {
        try {
          // LibreWXR: Drop-in-Ersatz für RainViewer v2
          const resp = await fetch('https://api.librewxr.net/public/weather-maps.json');
          const data = await resp.json();
          if (data.host) radarHost = data.host;
          const past = (data.radar && data.radar.past) || [];
          const nowcast = (data.radar && data.radar.nowcast) || [];
          pastFrameCount = past.length;
          allFrames = [...past, ...nowcast];

          if (allFrames.length === 0) {
            showRadarMessage('Keine Radar-Frames verfügbar.');
            return;
          }

          clearRadarLayers();
          radarLayers = allFrames.map((frame, i) => {
            const tileUrl = `${radarHost}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
            const layer = L.tileLayer(tileUrl, {
              opacity: 0,
              className: 'radar-tiles',
              maxNativeZoom: 7,
              maxZoom: 19
            });
            layer.on('tileerror', (e) => console.warn('[Radar] Kachel-Fehler:', e.tile && e.tile.src));
            layer.addTo(map);
            return layer;
          });

          buildTimeline();
          setRadarFrame(past.length > 0 ? past.length - 1 : 0, true);

          if (RADAR_AUTOPLAY && allFrames.length > 1) {
            setTimeout(() => {
              if (!isPlaying && !userInteracted && !document.hidden) {
                setRadarFrame(pastFrameCount > 0 ? pastFrameCount - 1 : 0, true);
                playAnimation();
              }
            }, 800);
          }
        } catch (err) {
          console.error('[Radar] Fehler:', err);
          showRadarMessage('Radar-Daten konnten nicht geladen werden.');
        }
      }

      function buildTimeline() {
        slider.min = 0;
        slider.max = allFrames.length - 1;
        slider.value = pastFrameCount > 0 ? pastFrameCount - 1 : 0;
        ticksContainer.innerHTML = '';
        const n = allFrames.length;
        for (let i = 0; i < n; i++) {
          const tick = document.createElement('div');
          tick.className = 'tl-tick' + (i >= pastFrameCount ? ' nowcast' : '');
          tick.style.left = n > 1 ? `${(i / (n - 1)) * 100}%` : '50%';
          ticksContainer.appendChild(tick);
        }
        startLabel.textContent = n > 0 ? formatFrameTime(allFrames[0].time) : '–';
        endLabel.textContent = n > 0 ? formatFrameTime(allFrames[n - 1].time) : '–';
        updateSliderTrackBackground();
      }

      function updateSliderTrackBackground() {
        const n = allFrames.length;
        if (n <= 1 || pastFrameCount >= n) {
          slider.style.setProperty('--slider-track-bg', '#90a4ae'); return;
        }
        if (pastFrameCount === 0) {
          slider.style.setProperty('--slider-track-bg', '#FFD966'); return;
        }
        const pastPercent = ((pastFrameCount -1) /  (n-1)) * 100;
        slider.style.setProperty('--slider-track-bg',
          `linear-gradient(to right, #90a4ae 0%, #90a4ae ${pastPercent}%, #FFD966 ${pastPercent}%, #FFD966 100%)`);
      }

      function setRadarFrame(index, force = false) {
        if (index < 0 || index >= radarLayers.length) return;
        if (!force && index === currentFrameIndex) return;
        if (currentFrameIndex >= 0 && radarLayers[currentFrameIndex]) {
          radarLayers[currentFrameIndex].setOpacity(0);
        }
        radarLayers[index].setOpacity(0.8);
        currentFrameIndex = index;
        lastFrameTime = allFrames[index].time;

        updateTimestamp();
        slider.value = index;

        updateCityTempsForFrame(index === pastFrameCount - 1);
      }

      function updateTimestamp() {
        if (allFrames.length === 0 || currentFrameIndex < 0) return;
        const frame = allFrames[currentFrameIndex];
        const timeStr = formatFrameTime(frame.time);
        const isNowcast = currentFrameIndex >= pastFrameCount;
        timeOverlay.textContent = isNowcast
          ? `Radar (Prognose) · ${timeStr} Uhr`
          : `Radar · ${timeStr} Uhr`;
      }

      slider.addEventListener('input', () => {
        userInteracted = true;
        const idx = parseInt(slider.value, 10);
        if (isPlaying) pauseAnimation();
        setRadarFrame(idx, true);
      });

      function playAnimation() {
        if (radarLayers.length <= 1) return;
        if (animationInterval) clearInterval(animationInterval);
        if (currentFrameIndex >= radarLayers.length - 1) setRadarFrame(0, true);
        animationInterval = setInterval(() => {
          let next = currentFrameIndex + 1;
          if (next >= radarLayers.length) next = 0;
          setRadarFrame(next);
        }, 600);
        isPlaying = true;
        playBtn.textContent = '⏸';
        playBtn.title = 'Pause';
      }

      function pauseAnimation() {
        if (animationInterval) clearInterval(animationInterval);
        animationInterval = null;
        isPlaying = false;
        playBtn.textContent = '▶';
        playBtn.title = 'Abspielen';
      }

      playBtn.addEventListener('click', () => {
        userInteracted = true;
        isPlaying ? pauseAnimation() : playAnimation();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          wasPlayingBeforeHide = isPlaying;
          if (isPlaying) pauseAnimation();
        } else if (wasPlayingBeforeHide) {
          playAnimation();
        }
      });

      function showRadarMessage(text) {
        const old = container.querySelector('.radar-message');
        if (old) old.remove();
        const div = document.createElement('div');
        div.className = 'radar-message';
        div.style.cssText = `
          position: absolute; z-index: 999; top: 3.5rem; left: 1rem; right: 1rem;
          background: #fff; color: #1E2A3A; border-left: 4px solid #D32F2F;
          padding: 0.8rem 1rem; border-radius: 6px; font-size: 0.85rem;
          box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        `;
        div.textContent = text;
        container.appendChild(div);
      }

      function weatherCodeToEmoji(code, isDay = true) {
        switch (code) {
          case 0:  return isDay ? '☀️' : '🌙';
          case 1:  return isDay ? '🌤️' : '🌙';
          case 2:  return '⛅';
          case 3:  return '☁️';
          case 45: case 48: return '🌫️';
          case 51: case 53: case 55: return '🌦️';
          case 56: case 57: case 61: case 63: case 65: case 66: case 67: return '🌧️';
          case 71: case 73: case 75: case 77: case 85: case 86: return '🌨️';
          case 80: case 81: case 82: return '🌦️';
          case 95: case 96: case 99: return '⛈️';
          default: return '❓';
        }
      }

      function rainColor(prob) {
        if (prob < 25) return '#64B5F6';
        if (prob < 50) return '#2196F3';
        if (prob < 75) return '#1565C0';
        return '#0D47A1';
      }

      async function loadForecast(lat, lon) {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', lat);
        url.searchParams.set('longitude', lon);
        url.searchParams.set('hourly', 'temperature_2m,weather_code,precipitation_probability');
        url.searchParams.set('timezone', 'Europe/Berlin');
        url.searchParams.set('forecast_hours', '24');
        try {
          const resp = await fetch(url);
          const data = await resp.json();
          if (!data.hourly || !data.hourly.time) throw new Error('Ungültige Antwort');
          renderHourlyForecastTable(data.hourly);
        } catch (err) {
          console.error('[Forecast] Fehler:', err);
          document.getElementById('forecast-table').innerHTML =
            '<tbody><tr><td colspan="4">Vorhersage konnte nicht geladen werden.</td></tr></tbody>';
        }
      }

      function renderHourlyForecastTable(hourly) {
        const table = document.getElementById('forecast-table');
        const indices = [];
        hourly.time.forEach((timeStr, i) => {
          if (new Date(timeStr).getHours() % 3 === 0) indices.push(i);
        });
        const selected = indices.slice(0, 8);

        const makeCell = (i) => {
          const date = new Date(hourly.time[i]);
          const hh = String(date.getHours()).padStart(2, '0');
          const mm = String(date.getMinutes()).padStart(2, '0');
          const temp = Math.round(hourly.temperature_2m[i]);
          const code = hourly.weather_code ? hourly.weather_code[i] : null;
          const rain = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
          const isDay = date.getHours() >= 6 && date.getHours() < 20;
          const emoji = code !== null ? weatherCodeToEmoji(code, isDay) : '';
          const tempClass = temp > 0 ? 'pos' : 'neg';
          const rainHtml = (rain !== null && rain !== undefined)
            ? `<span class="fc-rain"><span class="rain-dot" style="background:${rainColor(Math.round(rain))}"></span>${Math.round(rain)}%</span>`
            : `<span class="fc-rain"><span class="rain-dot" style="background:#cfd8e3"></span>–</span>`;
          return `
            <td>
              <span class="fc-time">${hh}:${mm}</span>
              <span class="fc-icon">${emoji}</span>
              <span class="fc-temp ${tempClass}">${temp}°C</span>
              ${rainHtml}
            </td>`;
        };

        let html = '<tbody>';
        for (let row = 0; row < 2; row++) {
          html += '<tr>';
          for (let col = 0; col < 4; col++) {
            const idx = selected[row * 4 + col];
            html += (idx !== undefined) ? makeCell(idx) : '<td>–</td>';
          }
          html += '</tr>';
        }
        html += '</tbody>';
        table.innerHTML = html;
        requestAnimationFrame(scheduleRadarInvalidate);
      }

      function getMostFrequent(arr) {
        if (arr.length === 0) return 0;
        const counts = {};
        let maxCount = 0;
        let mode = arr[0];
        arr.forEach(val => {
          counts[val] = (counts[val] || 0) + 1;
          if (counts[val] > maxCount) { maxCount = counts[val]; mode = val; }
        });
        return mode;
      }

      function getAverageWindDir(dirs) {
        if (dirs.length === 0) return 0;
        let sumSin = 0, sumCos = 0;
        dirs.forEach(dir => {
          const rad = dir * Math.PI / 180;
          sumSin += Math.sin(rad);
          sumCos += Math.cos(rad);
        });
        const avgRad = Math.atan2(sumSin / dirs.length, sumCos / dirs.length);
        let avgDeg = avgRad * 180 / Math.PI;
        if (avgDeg < 0) avgDeg += 360;
        return avgDeg;
      }

      function getWindArrow(dir, speed) {
        const speedKmh = Math.round(speed);
        return `
          <div class="wind-container">
            <svg viewBox="0 0 24 24" style="transform: rotate(${dir}deg);">
              <path d="M12 2 L12 22 M12 2 L6 10 M12 2 L18 10" stroke="#4a4a4a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>${speedKmh} km/h</span>
          </div>`;
      }

      async function loadDailyForecast(lat, lon) {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', lat);
        url.searchParams.set('longitude', lon);
        url.searchParams.set('daily', 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunshine_duration');
        url.searchParams.set('hourly', 'weather_code,precipitation_probability,windspeed_10m,winddirection_10m');
        url.searchParams.set('forecast_days', '4');
        url.searchParams.set('timezone', 'Europe/Berlin');
        try {
          const resp = await fetch(url);
          const data = await resp.json();
          if (!data.daily || !data.hourly) throw new Error('Ungültige Antwort');
          renderDailyForecast(data.daily, data.hourly);
        } catch (err) {
          console.error('[Daily Forecast] Fehler:', err);
          document.getElementById('daily-forecast-grid').innerHTML = '<div>Vorhersage konnte nicht geladen werden.</div>';
        }
      }

      function renderDailyForecast(daily, hourly) {
        const container = document.getElementById('daily-forecast-grid');
        container.innerHTML = '';
        const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

        for (let i = 0; i < 4; i++) {
          const date = new Date(daily.time[i]);
          const dayName = days[date.getDay()];
          const dateStr = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
          const isToday = i === 0;
          const relativeText = isToday ? '(heute)' : (i === 1 ? '(morgen)' : '');

          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);
          const sunHours = Math.round((daily.sunshine_duration[i] || 0) / 3600);
          const rainProb = daily.precipitation_probability_max[i] || 0;

          const slots = [
            { label: 'Vormittag', start: 6, end: 12 },
            { label: 'Mittag', start: 12, end: 16 },
            { label: 'Abend', start: 16, end: 20 },
            { label: 'Nacht', start: 0, end: 6 }
          ];

          let slotsHtml = '';
          slots.forEach(slot => {
            const indices = [];
            hourly.time.forEach((timeStr, idx) => {
              if (timeStr.startsWith(daily.time[i])) {
                const h = new Date(timeStr).getHours();
                if (h >= slot.start && h < slot.end) indices.push(idx);
              }
            });

            let emoji = '❓';
            let windHtml = '–';

            if (indices.length > 0) {
              const dominantCode = getMostFrequent(indices.map(idx => hourly.weather_code[idx]));
              const isDay = slot.start >= 6 && slot.start < 20;
              emoji = weatherCodeToEmoji(dominantCode, isDay);

              const windspeeds = indices.map(idx => hourly.windspeed_10m[idx]);
              const winddirs = indices.map(idx => hourly.winddirection_10m[idx]);
              const avgWindSpeed = windspeeds.reduce((a, b) => a + b, 0) / windspeeds.length || 0;
              const avgWindDir = getAverageWindDir(winddirs);

              windHtml = getWindArrow(avgWindDir, avgWindSpeed);
            }

            slotsHtml += `
              <div class="time-block">
                <div class="icon-wind">
                  <span class="slot-icon">${emoji}</span>
                  ${windHtml}
                </div>
                <div class="slot-label">${slot.label}</div>
              </div>`;
          });

          const html = `
            <div class="daily-col">
              <div class="row-datum">${dateStr}.</div>
              <div class="row-wochentag">${dayName} <span class="rel">${relativeText}</span></div>
              <div class="row-max">max ${maxTemp}°</div>
              <hr class="row-separator">
              <div class="row-min">min ${minTemp}°</div>
              ${slotsHtml}
              <div class="row-sun">☀️ ${sunHours} h</div>
              <div class="row-rain">💧 ${rainProb} %</div>
            </div>`;
          container.innerHTML += html;
        }
        requestAnimationFrame(scheduleRadarInvalidate);
      }

      function switchLocation(name, lat, lon) {
        currentLocation = { name, lat, lon };
        currentMarker.setLatLng([lat, lon]);
        currentMarker.setTooltipContent(name);
        map.setView([lat, lon], map.getZoom());
        document.getElementById('current-location-name').textContent = name;
        document.getElementById('forecast-location').textContent = name;
        updateCitiesInView();
        loadForecast(lat, lon);
        loadDailyForecast(lat, lon);
        saveCurrentLocation();
      }

      function renderFavorites() {
        const favContainer = document.getElementById('favorites-list');
        favContainer.innerHTML = '';

        for (let i = 0; i < MAX_FAVORITES; i++) {
          const fav = favorites[i];
          const btn = document.createElement('button');
          btn.className = 'fav-btn' + (fav ? '' : ' empty');

          if (fav) {
            const temp = favTemps[fav.name];
            const tempHtml = (temp !== undefined) ? `<span class="fav-temp">${temp}°</span>` : '';
            btn.innerHTML = `<span>${fav.name}</span>${tempHtml}<span class="fav-remove" title="Entfernen">×</span>`;
            btn.title = `${fav.name} – klicken zum Wechseln, × zum Entfernen`;
            btn.addEventListener('click', (ev) => {
              if (ev.target.classList.contains('fav-remove')) {
                delete favTemps[fav.name];
                favorites.splice(i, 1);
                saveFavorites();
                renderFavorites();
                updateFavoriteTemps();
              } else {
                switchLocation(fav.name, fav.lat, fav.lon);
              }
            });
          } else {
            btn.textContent = '+';
            btn.title = 'Aktuellen Ort als Favorit speichern';
            btn.addEventListener('click', () => {
              const exists = favorites.some(f =>
                Math.abs(f.lat - currentLocation.lat) < 0.01 &&
                Math.abs(f.lon - currentLocation.lon) < 0.01
              );
              if (exists) { alert('Dieser Ort ist bereits als Favorit gespeichert.'); return; }
              if (favorites.length >= MAX_FAVORITES) { alert('Maximal 5 Favoriten.'); return; }
              favorites.push({ ...currentLocation });
              saveFavorites();
              renderFavorites();
              updateFavoriteTemps();
            });
          }
          favContainer.appendChild(btn);
        }
      }

      async function updateFavoriteTemps() {
        const validFavs = favorites.filter(f => f && f.name && f.lat !== undefined && f.lon !== undefined);
        if (validFavs.length === 0) { favTemps = {}; renderFavorites(); return; }
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', validFavs.map(f => f.lat).join(','));
        url.searchParams.set('longitude', validFavs.map(f => f.lon).join(','));
        url.searchParams.set('current', 'temperature_2m');
        url.searchParams.set('timezone', 'Europe/Berlin');
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          const results = Array.isArray(data) ? data : [data];
          const newTemps = {};
          results.forEach((entry, idx) => {
            const fav = validFavs[idx];
            if (!fav) return;
            const t = entry?.current?.temperature_2m;
            if (t !== undefined && t !== null) newTemps[fav.name] = Math.round(t);
          });
          favTemps = newTemps;
          renderFavorites();
        } catch (err) {
          console.warn('[Favoriten]', err);
          favTemps = {};
          renderFavorites();
        }
      }

      const searchInput = document.getElementById('location-search');
      const searchResults = document.getElementById('search-results');
      const searchBtn = document.getElementById('search-btn');

      async function performSearch() {
        const query = searchInput.value.trim();
        if (!query) return;
        searchResults.innerHTML = '<div class="search-result-item">Suche läuft…</div>';
        searchResults.style.display = 'block';
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6&addressdetails=1&accept-language=de`;
          const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          displaySearchResults(await resp.json());
        } catch (err) {
          console.error('[Suche]', err);
          searchResults.innerHTML = '<div class="search-result-item">Suche fehlgeschlagen.</div>';
        }
      }

      function displaySearchResults(results) {
        searchResults.innerHTML = '';
        if (!results || results.length === 0) {
          searchResults.innerHTML = '<div class="search-result-item">Keine Treffer.</div>';
          return;
        }
        results.forEach(r => {
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.textContent = r.display_name;
          item.addEventListener('click', () => {
            const shortName = r.name || r.display_name.split(',')[0].trim();
            switchLocation(shortName, parseFloat(r.lat), parseFloat(r.lon));
            searchResults.style.display = 'none';
            searchInput.value = '';
          });
          searchResults.appendChild(item);
        });
      }

      searchBtn.addEventListener('click', performSearch);
      searchInput.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); performSearch(); }
        if (ev.key === 'Escape') { searchResults.style.display = 'none'; }
      });

      document.addEventListener('click', (ev) => {
        const wrapper = document.querySelector('.search-wrapper');
        if (wrapper && !wrapper.contains(ev.target)) searchResults.style.display = 'none';
      });

      document.getElementById('current-location-name').textContent = currentLocation.name;
      document.getElementById('forecast-location').textContent = currentLocation.name;

      renderFavorites();
      renderLandmarkMarkers();

      Promise.allSettled([
        loadRadar(),
        loadForecast(currentLocation.lat, currentLocation.lon),
        loadDailyForecast(currentLocation.lat, currentLocation.lon),
        updateFavoriteTemps(),
        updateMountainTemps(),
        updateWaterTemps()
      ]);

      setInterval(() => {
        if (!document.hidden) {
          updateFavoriteTemps();
          updateMountainTemps();
          updateWaterTemps();
          loadDailyForecast(currentLocation.lat, currentLocation.lon);
        }
      }, 15 * 60 * 1000);

      window.addEventListener('resize', debounce(() => map.invalidateSize(), 200));
    }
  </script>
</body>
</html>
